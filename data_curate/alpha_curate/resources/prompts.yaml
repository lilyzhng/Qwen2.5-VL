scenarios:
# Camera obstruction
# * FOV fully blocked
# * FOV partially blocked
# * water drops
  - name: "camera_obstruction"
    prompts:
      - prompt: "Camera view fully blocked by an object stuck to the windshield"
        camera_names: &front-cameras ["camera_front_wide", "camera_front_narrow"]
        similarity_threshold: 0.29
      - prompt: "Camera lens partially covered by mud dirt tape or debris occluding the scene"
        camera_names: *front-cameras
        similarity_threshold: 0.29
      - prompt: "Water droplets or moisture stuck on the camera lens blurring the view"
        camera_names: *front-cameras
        similarity_threshold: 0.29
  - name: "peds_crossing_road"
    prompts:
      - prompt: "People running across the road"
        camera_names: *front-cameras
        similarity_threshold: 0.3
